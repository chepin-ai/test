[workspace]
members = ["kernel", "userspace", "examples/scientific_discovery", "examples/finguard", "examples/supplynet", "examples/medmind"]
resolver = "2"

[workspace.package]
version = "0.1.0-xi"
edition = "2021"
license = "MIT/Apache-2.0"
repository = "https://github.com/formal-os/asfa-os-xi"

[workspace.dependencies]
# 形式化与ZK
halo2_proofs = { version = "0.3", features = ["dev-graph"] }
ff = "0.13"
group = "0.13"

# 并发与并行
rayon = "1.8"
crossbeam = "0.8"

# 数学/图论
petgraph = "0.6"
nalgebra = "0.32"
rand = "0.8"

# 序列化
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# 内存管理
bumpalo = "3.14"
